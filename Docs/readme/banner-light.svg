<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img" aria-label="LearnMetal Engine: A small game engine on Metal, written twice, in Swift and in C++, with two games and an editor made with it."><title>LearnMetal Engine: A small game engine on Metal, written twice, in Swift and in C++, with two games and an editor made with it.</title><style>
