" fill="#e6edf3">A scene editor</text><text x="572.0" y="194" class="sans" font-size="13.5" fill="#8b949e">Made with the engine's own GUI: handles,</text><text x="572.0" y="213" class="sans" font-size="13.5" fill="#8b949e">inspector, undo and redo, and Play / Stop.</text></g><g><rect x="0.5" y="256.5" width="471.0" height="111" rx="12" fill="#161b22" stroke="#30363d"/><rect x="0.5" y="256.5" width="471.0" height="111" rx="12" fill="none" stroke="#58a6ff" stroke-opacity=".5" class="hl" style="animation-delay:6.40s"/><rect x="24.0" y="280" width="40" height="40" rx="10" fill="none" stroke="#30363d"/><rect x="24.0" y="280" width="40" height="40" rx="10" fill="#58a6ff" fill-opacity=".12" class="hl" style="animation-delay:6.40s"/><g transform="translate(32.0 288)"><path d="M8 8l8 8M16 8l-8 8M5 2.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM19 2.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM5 16.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM19 16.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z" fill="none" stroke="#58a6ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="84.0" y="298" class="sans" font-size="16.5" font-weight="700" fill="#e6edf3">Two complete games</text><text x="84.0" y="322" class="sans" font-size="13.5" fill="#8b949e">Marble, a course of floating platforms and eight</text><text x="84.0" y="341" class="sans" font-size="13.5" fill="#8b949e">gems, and FPV, a simulated racing drone.</text></g><g><rect x="488.5" y="256.5" width="471.0" height="111" rx="12" fill="#161b22" stroke="#30363d"/><rect x="488.5" y="256.5" width="471.0" height="111" rx="12" fill="none" stroke="#58a6ff" stroke-opacity=".5" class="hl" style="animation-delay:8.00s"/><rect x="512.0" y="280" width="40" height="40" rx="10" fill="none" stroke="#30363d"/><rect x="512.0" y="280" width="40" height="40" rx="10" fill="#58a6ff" fill-opacity=".12" class="hl" style="animation-delay:8.00s"/><g transform="translate(520.0 288)"><path d="M3 5h6a3 3 0 0 1 3 3v12a2.5 2.5 0 0 0-2.5-2.5H3zM21 5h-6a3 3 0