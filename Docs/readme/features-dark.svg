<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 368" width="960" height="368" role="img" aria-label="Features: Physically based rendering: glTF metallic-roughness materials in HDR, cascaded shadows, sky lighting, SSAO, bloom and fog.; One engine, two languages: Swift and C++ twins with the same functions and comments; shaders and GPU structs written once.; Everything a game needs: Entities and components, fixed-step physics, named input actions, a software mixer and assets.; A scene editor: Made with the engine's own GUI: handles, inspector, undo and redo, and Play / Stop.; Two complete games: Marble, a course of floating platforms and eight gems, and FPV, a simulated racing drone.; Follows the tutorials: Four LearnMetal chapters walk through this code, and a table maps every chapter to the engine."><title>Features: Physically based rendering: glTF metallic-roughness materials in HDR, cascaded shadows, sky lighting, SSAO, bloom and fog.; One engine, two languages: Swift and C++ twins with the same functions and comments; shaders and GPU structs written once.; Everything a game needs: Entities and components, fixed-step physics, named input actions, a software mixer and assets.; A scene editor: Made with the engine's own GUI: handles, inspector, undo and redo, and Play / Stop.; Two complete games: Marble, a course of floating platforms and eight gems, and FPV, a simulated racing drone.; Follows the tutorials: Four LearnMetal chapters walk through this code, and a table maps every chapter to the engine.</title><style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.hair{fill:none;stroke:#58a6ff;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.dimline{fill:none;stroke:#484f58;stroke-width:1;stroke-linecap:round}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blip{0%{opacity:1}55%,100%{opacity:.12}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes ring{0%{r:3px;opacity:.9}100%{r:16px;opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
