# The Xcode project of the iPhone app is generated from this file by XcodeGen, so that
# there is no hand-edited project file to go wrong:
#
#   brew install xcodegen
#   cd iOS
#   xcodegen generate
#   open FPV.xcodeproj
#
# In Xcode: choose your team under Signing & Capabilities, pick your iPhone, press Run.
name: FPV
options:
  bundleIdPrefix: com.gabrielevierti
  deploymentTarget:
    iOS: "16.0"
packages:
  LearnMetalEngine:
    path: ..
targets:
  FPV:
    type: application
    platform: iOS
    sources:
      - path: App
      # The engine compiles its shaders and loads its assets from these folders when it
      # starts: they go into the app as they are.
      - path: ../Shaders
        type: folder
        buildPhase: resources
      - path: ../Assets
        type: folder
        buildPhase: resources
    dependencies:
      - package: LearnMetalEngine
        product: FPVKit
      - package: LearnMetalEngine
        product: LMEngine
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: FPV
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - metal
        # Tells the system the game can be played entirely with a controller.
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gabrielevierti.fpv
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
